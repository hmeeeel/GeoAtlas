services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: geoatlas
      POSTGRES_PASSWORD: geoatlas
      POSTGRES_DB: geoatlas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoatlas -d geoatlas"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://geoatlas:geoatlas@db:5432/geoatlas
      PORT: "4000"
    env_file:
      - path: .env
        required: false
    ports:
      - "4000:4000"

volumes:
  pgdata:
